global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hobot-exporter"
    static_configs:
      # Замени на реальный IP устройства, где запущен exporter (например,
      # роутер с Entware, Raspberry Pi, или другая всегда включённая
      # машина в локальной сети — см. router/README.md)
      - targets: ["192.168.1.1:9099"]
