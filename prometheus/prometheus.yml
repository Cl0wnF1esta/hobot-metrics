global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "hobot-exporter"
    static_configs:
      # Замени на реальный адрес устройства-экспортера внутри WireGuard-туннеля
      # (Prometheus не умеет читать .env сам по себе — правь вручную)
      - targets: ["10.0.0.2:9099"]
