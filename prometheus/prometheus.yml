global:
  scrape_interval: 60s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hobot-exporter"
    static_configs:
      # Replace with the actual exporter host address inside the WireGuard
      # tunnel (Prometheus can't read .env itself — edit this by hand)
      - targets: ["10.0.0.2:9099"]
# Optional local extensions (the directory is git-ignored): extra alert rules
# go to prometheus/extra/*-alerts.yml, extra scrape jobs to *-scrape.yml.
rule_files:
  - /etc/prometheus/extra/*-alerts.yml
scrape_config_files:
  - /etc/prometheus/extra/*-scrape.yml
